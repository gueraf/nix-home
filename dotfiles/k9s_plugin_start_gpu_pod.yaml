plugins:
  # ---------------------------------------------------------------------------
  # Plugin: Start GPU Pod (With RuntimeClass & Privileges)
  # View: Nodes (:node)
  # Shortcut: g
  # ---------------------------------------------------------------------------
  gpu-node-start:
    shortCut: g
    description: "Start GPU Pod"
    scopes:
      - nodes
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - |
        NODE_NAME="$NAME"
        K8S_CONTEXT="$CONTEXT"

        if [ -z "$NODE_NAME" ]; then
           echo "Error: Node name is empty."
           exit 1
        fi

        # 1. Ask for Image Name
        read -p "Enter Image (leave blank for auto-detect): " CUSTOM_IMAGE

        if [ -n "$CUSTOM_IMAGE" ]; then
            IMAGE="$CUSTOM_IMAGE"
            echo "-> Using custom image: $IMAGE"
        else
            # Auto-Detect Architecture
            ARCH=$(kubectl get node "$NODE_NAME" --context "$K8S_CONTEXT" -o jsonpath='{.metadata.labels.beta\.kubernetes\.io/arch}')
            
            if [ -z "$ARCH" ]; then
              ARCH=$(kubectl get node "$NODE_NAME" --context "$K8S_CONTEXT" -o jsonpath='{.metadata.labels.kubernetes\.io/arch}')
            fi
            if [ -z "$ARCH" ]; then
              ARCH=$(kubectl get node "$NODE_NAME" --context "$K8S_CONTEXT" -o jsonpath='{.status.nodeInfo.architecture}')
            fi

            ARCH=$(echo "$ARCH" | tr -d '[:space:]')

            if [[ "$ARCH" == "arm64" ]] || [[ "$ARCH" == "aarch64" ]]; then
              IMAGE="gueraf/dev:arm"
            else
              IMAGE="gueraf/dev:latest"
            fi
            echo "-> Auto-detected ($ARCH). Using: $IMAGE"
        fi

        # 2. Ask for GPU Count
        read -p "Enter GPU Count (default: 1): " GPU_COUNT
        GPU_COUNT=${GPU_COUNT:-1}

        # 3. Build Overrides
        #    CHANGES:
        #    - Added runtimeClassName: nvidia (Crucial for many clusters)
        #    - Added securityContext: privileged: true
        #    - Added ENV vars to force driver capabilities
        OVERRIDES='
        {
          "apiVersion": "v1",
          "spec": {
            "runtimeClassName": "nvidia",
            "nodeSelector": {
              "kubernetes.io/hostname": "'"$NODE_NAME"'"
            },
            "tolerations": [
              { "operator": "Exists" }
            ],
            "containers": [
              {
                "name": "gpu-dev",
                "image": "'"$IMAGE"'",
                "securityContext": {
                  "privileged": true
                },
                "env": [
                  { "name": "NVIDIA_VISIBLE_DEVICES", "value": "all" },
                  { "name": "NVIDIA_DRIVER_CAPABILITIES", "value": "compute,utility,video" }
                ],
                "resources": {
                  "limits": {
                    "nvidia.com/gpu": "'"$GPU_COUNT"'"
                  }
                }
              }
            ]
          }
        }
        '

        # 4. Run Pod
        POD_NAME="gpu-dev-$RANDOM"
        
        # We capture the output to check for errors immediately
        OUTPUT=$(kubectl run "$POD_NAME" \
          --context "$K8S_CONTEXT" \
          --image="$IMAGE" \
          --restart=Never \
          --overrides="$OVERRIDES" \
          -- sleep infinity 2>&1)

        # Check if it failed because "runtimeClassName" is unknown
        if [[ "$OUTPUT" == *"unknown field \"runtimeClassName\""* ]] || [[ "$OUTPUT" == *"not found"* ]]; then
           echo "Warning: 'runtimeClassName: nvidia' failed. Retrying without it..."
           
           # Remove runtimeClassName from overrides and try again
           CLEAN_OVERRIDES=$(echo "$OVERRIDES" | grep -v "runtimeClassName")
           
           kubectl run "$POD_NAME" \
             --context "$K8S_CONTEXT" \
             --image="$IMAGE" \
             --restart=Never \
             --overrides="$CLEAN_OVERRIDES" \
             -- sleep infinity
        else
           echo "$OUTPUT"
        fi

        echo "Pod $POD_NAME started."
        sleep 1
