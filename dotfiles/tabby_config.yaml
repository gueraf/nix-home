version: 1
recoverTabs: false
enableWelcomeTab: false
enableAnalytics: false
terminal:
  autoOpen: false
startupProfiles:
  - local:ssh-yin-zrh
  - local:ssh-limmat-zrh
  - local:ssh-sihl-zrh
  - local:ssh-isambard-zrh
  - local:ssh-beast
  - local:ssh-trn3-dev1-gueraf-b
  - local:ssh-trn3-dev1-gueraf-1
  - local:ssh-tsnet-train-aps3-2
  - local:ssh-odysseus
  - local:ssh-zygmunt
profiles:
  - id: local:ssh-yin-zrh
    type: local
    name: yin-zrh
    icon: fas fa-terminal
    disableDynamicTitle: true
    options:
      command: /bin/bash
      args:
        - -c
        - while true; do ssh yin-zrh; read -r -p "[yin-zrh disconnected — press Enter to reconnect, or type 'shell' for local bash] " ans || break; if [ "$ans" = "shell" ]; then TMUX=tabby exec /bin/bash -i; fi; done
