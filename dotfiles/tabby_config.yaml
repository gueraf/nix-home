version: 1
recoverTabs: false
enableWelcomeTab: false
enableAnalytics: false
hotkeys:
  next-tab:
    - Ctrl-PageDown
    - Ctrl-Shift-Right
    - Ctrl-Tab
  previous-tab:
    - Ctrl-PageUp
    - Ctrl-Shift-Left
    - Ctrl-Shift-Tab
  scroll-to-top:
    - Shift-PageUp
  scroll-to-bottom:
    - Shift-PageDown
terminal:
  autoOpen: false
  copyOnSelect: true
startupProfiles:
  - local:localhost
  - local:ssh-yin-zrh
  - local:ssh-yang-zrh
  - local:ssh-limmat-zrh
  - local:ssh-sihl-zrh
  - local:ssh-odysseus
profiles:
  - id: local:localhost
    type: local
    name: localhost
    icon: fas fa-laptop
    disableDynamicTitle: true
    options:
      command: /bin/bash
      args:
        - -l
  - id: local:ssh-yin-zrh
    type: local
    name: yin-zrh
    icon: fas fa-terminal
    disableDynamicTitle: true
    options:
      command: /bin/bash
      args:
        - -c
        - while true; do ssh yin-zrh; read -r -p "[yin-zrh disconnected — press Enter to reconnect, or type 'shell' for local bash] " ans || break; if [ "$ans" = "shell" ]; then TMUX=tabby exec /bin/bash -i; fi; done
